<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="disc" cx="0.36" cy="0.28" r="0.9">
      <stop offset="0%" stop-color="#332e2b"/>
      <stop offset="55%" stop-color="#17130f"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#ff4326"/>
      <stop offset="30%" stop-color="#e02417"/>
      <stop offset="62%" stop-color="#94120a"/>
      <stop offset="100%" stop-color="#4a0803"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="0.02" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffd049"/>
      <stop offset="30%" stop-color="#ff9412"/>
      <stop offset="70%" stop-color="#f4491a"/>
      <stop offset="100%" stop-color="#c8160c"/>
    </linearGradient>
    <linearGradient id="core" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff6de"/>
      <stop offset="48%" stop-color="#ffd875"/>
      <stop offset="100%" stop-color="#ff8f14"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#disc)"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="url(#ring)" stroke-width="11"/>

  <!-- outer flame: tall body, curled tip leaning right, notched left lick.
       Scaled up and re-centred so it still reads at 16px. -->
  <g transform="translate(-29 -1) scale(1.32)">
  <path fill="url(#flame)" d="M104 24
    c-2 22 12 34 22 48
    c13 18 12 44 -8 58
    c-16 11 -38 8 -49 -7
    c-12 -16 -9 -36 2 -49
    c8 -10 15 -18 16 -30
    c7 9 10 19 9 30
    c9 -13 11 -33 8 -50 z"/>

  <!-- inner core -->
  <path fill="url(#core)" d="M101 84
    c1 12 8 17 11 26
    c4 12 -2 24 -12 27
    c-11 -3 -17 -15 -13 -27
    c3 -9 12 -14 14 -26 z"/>
  </g>
</svg>
